<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050a07" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      /* Tema guardado, aplicado antes de pintar. La lógica completa vive en src/theme/theme.js. */
      try {
        var m = localStorage.getItem('pf-theme') || 'auto', t = m;
        if (m === 'auto') t = matchMedia('(prefers-contrast: more)').matches ? 'contraste' : matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'noche';
        if (/^[a-z][a-z0-9-]{1,23}$/.test(t)) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <title>Panel de Flota · Las Cabras Sinaloa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
